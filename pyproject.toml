[project]
name = "jmi"
version = "0.1.0"
description = "Job Market Intelligence — scrape, extract, and analyze job postings."
readme = "README.md"
authors = [
    { name = "Mateusz Jastrzebski", email = "mateusz.jas21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.50",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.0",
    "sqlalchemy>=2",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
jmi = "jmi.cli:app"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
    "types-pyyaml>=6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pgvector.*"]
ignore_missing_imports = true
