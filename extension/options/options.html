<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JMI Job Saver — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 32px auto;
        padding: 0 16px;
        color: #0f172a;
      }
      h1 { font-size: 18px; margin-bottom: 4px; }
      .subtitle { color: #64748b; margin: 0 0 16px; font-size: 13px; }
      code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; }
      label { display: block; margin-top: 16px; font-size: 13px; font-weight: 500; }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        font-size: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .row { margin-top: 16px; display: flex; gap: 8px; }
      button {
        padding: 8px 16px;
        font-size: 13px;
        background: #14b8a6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button.secondary {
        background: white;
        color: #14b8a6;
        border: 1px solid #14b8a6;
      }
      .msg { margin-top: 12px; font-size: 12px; min-height: 1em; }
      .msg.ok { color: #16a34a; }
      .msg.err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>JMI Job Saver</h1>
    <p class="subtitle">
      Configure the local JMI backend. The ingest token must match
      <code>JMI_INGEST_TOKEN</code> in your backend <code>.env</code>.
    </p>

    <label>
      JMI URL
      <input id="jmi-url" type="url" placeholder="http://127.0.0.1:8000" />
    </label>

    <label>
      Ingest token
      <input
        id="ingest-token"
        type="password"
        autocomplete="off"
        placeholder="paste from .env JMI_INGEST_TOKEN"
      />
    </label>

    <div class="row">
      <button id="save-btn">Save settings</button>
      <button id="test-btn" class="secondary">Test connection</button>
    </div>

    <div id="msg" class="msg"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
